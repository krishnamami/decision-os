# Decision OS — local dev infrastructure
# Brings up Postgres + Redis so the production backends in
# core/context_store/ (PostgresDurableStore, RedisHotCache) can run
# end-to-end. The in-memory variants used in tests do not need this.
#
# Quick start:
#   docker-compose up -d
#   psql postgresql://decisionos:decisionos@localhost:5432/decisionos \
#     -f core/context_store/schema.sql
#
# Or apply schema from Python:
#   store = await PostgresDurableStore.connect(
#       "postgresql://decisionos:decisionos@localhost:5432/decisionos"
#   )
#   await store.init_schema()

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: decisionos-postgres
    environment:
      POSTGRES_USER: decisionos
      POSTGRES_PASSWORD: decisionos
      POSTGRES_DB: decisionos
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: decisionos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
