# Decision OS / Accord — full local stack.
#
#   postgres + redis : dev infrastructure for core/context_store
#   api              : Accord FastAPI backend (reads real data from
#                      DATABASE_URL in .env — e.g. AWS RDS)
#   frontend         : React app served by nginx, proxying /api/ → api
#
# Quick start:
#   docker-compose up --build
#     http://localhost            → React app
#     http://localhost/api/...    → API (proxied to the api service)
#
# The api connects to whatever DATABASE_URL points at (.env). The local
# postgres/redis are for core/context_store and optional caching.

services:
  postgres:
    image: postgres:16-alpine
    container_name: decisionos-postgres
    environment:
      POSTGRES_USER: decisionos
      POSTGRES_PASSWORD: decisionos
      POSTGRES_DB: decisionos
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: decisionos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: accord-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: accord-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
