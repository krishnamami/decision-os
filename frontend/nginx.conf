server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed assets aggressively; never cache index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API requests are proxied to the backend service.
  #
  # On AWS the ALB routes /api/* to the API target group, so this block is
  # never hit in production. In local docker-compose it proxies to the `api`
  # service. The hostname is resolved at REQUEST time (variable + Docker's
  # embedded DNS) rather than at startup, so nginx boots cleanly even when no
  # `api` host exists — e.g. the standalone ECS frontend task.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $accord_api http://api:8000;
    proxy_pass $accord_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — let React Router handle client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
