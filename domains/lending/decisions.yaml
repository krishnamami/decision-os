# ============================================================
# Decision OS — Lending Domain Pack
# decisions.yaml — source of truth for all lending decisions
# ============================================================
# Each decision defines:
#   - its data requirements (own vs shared)
#   - dependencies on other decisions
#   - the agent persona assigned to it
#   - the decision mode (shadow / recommend / human_approval / auto_execute)
#   - the boundary (what is allowed, blocked, escalated)
# ============================================================

domain: lending
version: "1.0.0"
description: >
  Full mortgage lending cycle — 12 decisions from lead intake
  through closing readiness. Independent decisions run first;
  dependent decisions receive enriched context from their
  upstream decisions.

# ─────────────────────────────────────────────
# SHARED DATA — available to all decisions
# ─────────────────────────────────────────────
shared_data:
  - customer_profile
  - application_record
  - kyc_status
  - credit_bureau_pull
  - fraud_watchlist
  - regulatory_constraints
  - product_catalog

# ─────────────────────────────────────────────
# DECISIONS
# ─────────────────────────────────────────────
decisions:

  # ── INDEPENDENT DECISIONS ──────────────────

  - id: lead_scoring
    name: Lead scoring
    atomic_tool: lead_scoring_tool
    context_window_days: 30
    type: independent
    description: >
      Evaluates inbound leads to determine intent quality,
      channel fit, and likelihood to convert. Runs before
      any application is opened.
    own_data:
      - lead_source
      - utm_params
      - session_behavior
      - prior_inquiries
    shared_data:
      - customer_profile
    persona: lead_qualification_agent
    mode: auto_execute
    risk_level: low
    owner_team: growth_ops
    boundary:
      automate_if:
        - intent_score >= 0.7
        - channel in [digital, api_partner]
      recommend_if:
        - intent_score >= 0.5
        - intent_score < 0.7
      block_if:
        - source in fraud_watchlist
      escalate_if:
        - ambiguous_identity == true
    sla_seconds: 5
    trace_required: true

  - id: employment_reconciliation
    name: Employment reconciliation
    atomic_tool: employment_reconciliation_tool
    context_window_days: 730     # 24-month continuity window
    type: independent
    description: >
      Joins multi-source verification attempts (TWN, Argyle, Plaid,
      payroll feeds, manual VOE, tax transcripts) into a continuous
      employment timeline for the applicant. Produces
      reconciliation_status (auto_verified | partial | conflict |
      missing) plus per-employer EmploymentRecord projections.
      Detects employer-name divergence across providers, comp drift
      vs stated, tenure mismatch vs stated, and continuity-coverage
      gaps. Manual VOE / tax transcript pull / gap letter all queue
      from this decision when reconciliation falls short of policy.
      Now wired upstream of income_verification — its output drives
      income_verification's outcome rather than running in parallel
      shadow mode.
    own_data:
      - verification_attempts
    shared_data:
      - application_record
      - customer_profile
    persona: employment_reconciliation_agent
    mode: recommend
    risk_level: medium
    owner_team: underwriting
    boundary:
      automate_if:
        - reconciliation_status == auto_verified
        - continuity_coverage_pct >= 0.95
        - max_gap_days <= 30
        - employer_name_match_confidence >= 0.90
        - stated_vs_verified_drift_pct <= 0.10
      recommend_if:
        - reconciliation_status == partial
        - continuity_coverage_pct >= 0.80
      escalate_if:
        - reconciliation_status == conflict
        - continuity_coverage_pct < 0.80
      block_if:
        - employer_on_watchlist == true
    sla_seconds: 60
    trace_required: true

  - id: income_verification
    name: Income verification
    atomic_tool: income_verification_tool
    context_window_days: 90
    type: dependent
    description: >
      Validates stated income against the reconciled employment
      timeline produced by employment_reconciliation. Reads
      reconciliation_status, employer_records, and aggregated
      gross_amount from the upstream output. Critical input for
      DTI and product eligibility downstream.
    depends_on:
      - decision: employment_reconciliation
        required_output: reconciliation_status
        inherit_context: true
    own_data:
      - stated_income
      - employment_type
      - payroll_records
      - tax_returns
      - bank_statements
    shared_data:
      - application_record
      - kyc_status
    persona: income_verification_agent
    mode: human_approval
    risk_level: medium
    owner_team: underwriting
    boundary:
      automate_if:
        - income_confidence_score >= 0.9
        - employment_type == salaried
        - payroll_verified == true
        - reconciliation_status in [auto_verified, partial]
      recommend_if:
        - income_confidence_score >= 0.75
        - reconciliation_status in [auto_verified, partial]
      block_if:
        - income_discrepancy_pct > 0.25
      escalate_if:
        # rule grammar is AND-only within a clause. Conflict/missing
        # reconciliation is the dominant escalate trigger; multi-source
        # + foreign-income trigger separately via the persona's
        # proposed_outcome (atomic_tool routes ESCALATE outcomes even
        # when the boundary doesn't match an escalate clause).
        - reconciliation_status in [conflict, missing]
    sla_seconds: 120
    trace_required: true

  - id: credit_assessment
    name: Credit assessment
    atomic_tool: credit_assessment_tool
    context_window_days: 90
    type: independent
    description: >
      Pulls and interprets credit bureau data to determine
      credit band, risk score, and derogatory flags.
      Feeds LTV assessment and rate pricing downstream.
    own_data:
      - credit_bureau_report
      - payment_history
      - open_tradelines
      - derogatory_marks
      - credit_utilization
    shared_data:
      - credit_bureau_pull
      - application_record
    persona: credit_risk_agent
    mode: auto_execute
    risk_level: medium
    owner_team: credit_risk
    boundary:
      automate_if:
        - expression: credit_score >= 680
          governed_by:
            type: tenant_rules
            field: credit.min_score
            threshold_field: credit.min_score
            note: Tenant overlay — agency floor is 620 (Fannie) or 580 (FHA)
        - no_derogatory_last_24_months == true
      recommend_if:
        - expression: credit_score >= 600
          governed_by:
            type: agency_guidelines
            agency: fannie
            guideline_name: Minimum Credit Score
            citation: Selling Guide B3-5.1-01
            threshold_field: credit.min_score
        - credit_score < 680
      block_if:
        - active_bankruptcy == true
        - foreclosure_last_36_months == true
        - expression: credit_score < 580
          governed_by:
            type: agency_guidelines
            agency: fha
            guideline_name: Minimum Decision Credit Score
            citation: HUD Handbook 4000.1 II.A.4
            threshold_field: credit.min_score
      escalate_if:
        - thin_file == true
        - credit_score is null
    sla_seconds: 10
    trace_required: true

  - id: fraud_screening
    name: Fraud screening
    atomic_tool: fraud_screening_tool
    context_window_days: 30
    type: independent
    description: >
      Screens application for identity fraud, synthetic identity,
      document forgery, and known fraud patterns.
      Hard block capability — can stop the entire pipeline.
    own_data:
      - identity_documents
      - device_fingerprint
      - ip_geolocation
      - velocity_signals
    shared_data:
      - fraud_watchlist
      - kyc_status
      - customer_profile
    persona: fraud_detection_agent
    mode: auto_execute
    risk_level: high
    owner_team: fraud_ops
    boundary:
      automate_if:
        - fraud_score < 0.2
        - identity_match_confidence >= 0.95
        # FR-E: never auto-clear when a detector (FR-B/C/D) has raised an
        # unresolved fraud signal — fall through to the persona's proposed
        # outcome (escalate on high/any signal, block on auto_block).
        - fraud_signal_count == 0
      recommend_if:
        - fraud_score >= 0.2
        - fraud_score < 0.5
      block_if:
        - expression: fraud_score >= 0.5
          governed_by:
            type: tenant_rules
            field: fraud.watchlist_threshold
            threshold_field: fraud.watchlist_threshold
            note: Tenant overlay — federal minimum is OFAC mandatory (31 CFR Part 501)
        - expression: watchlist_match == true
          governed_by:
            type: regulatory_rules
            authority: ofac
            rule_name: OFAC SDN Screening
            citation: 31 CFR Part 501
        - expression: synthetic_identity_flag == true
          governed_by:
            type: regulatory_rules
            authority: bsa
            rule_name: SAR Filing Requirement
            citation: 31 CFR 1020.320
      escalate_if:
        - document_authenticity_score < 0.8
    sla_seconds: 8
    trace_required: true

  - id: compliance_check
    name: Compliance check
    atomic_tool: compliance_check_tool
    context_window_days: 180
    type: independent
    description: >
      Validates application against regulatory requirements —
      HMDA, ECOA, fair lending, state-specific rules.
      Runs independently but gates closing readiness downstream.
    own_data:
      - application_demographics
      - loan_purpose
      - property_location
      - hmda_fields
    shared_data:
      - regulatory_constraints
      - application_record
    persona: compliance_agent
    mode: human_approval
    risk_level: high
    owner_team: compliance
    boundary:
      automate_if:
        - all_hmda_fields_complete == true
        - no_fair_lending_flags == true
        - state_rules_passed == true
      recommend_if:
        - minor_data_gap == true
      block_if:
        - expression: fair_lending_violation == true
          governed_by:
            type: regulatory_rules
            authority: federal
            rule_name: Adverse Action Specific Reasons
            citation: Regulation B §1002.9(a)(2)
        - expression: missing_required_disclosures == true
          governed_by:
            type: regulatory_rules
            authority: federal
            rule_name: Loan Estimate Delivery
            citation: Regulation Z §1026.19(e)
        - expression: tx_cashout_ltv_violation == true
          governed_by:
            type: regulatory_rules
            authority: state
            jurisdiction: TX
            rule_name: Texas Cash-Out Refinance LTV Limit
            citation: TX Constitution Art. XVI 50(a)(6)
      escalate_if:
        - regulatory_ambiguity == true
        - mixed_jurisdiction == true
    sla_seconds: 60
    trace_required: true

  # ── DEPENDENT DECISIONS ────────────────────

  - id: dti_calculation
    name: DTI calculation
    atomic_tool: dti_calculation_tool
    context_window_days: 90
    type: dependent
    depends_on:
      - decision: income_verification
        required_output: verified_income
        inherit_context: true
    description: >
      Calculates debt-to-income ratio using verified income
      (not stated). Inherits income context from upstream.
      Incorrect income verification directly corrupts this output.
    own_data:
      - existing_debt_obligations
      - proposed_payment
    shared_data:
      - application_record
    persona: underwriting_agent
    mode: auto_execute
    risk_level: low
    owner_team: underwriting
    boundary:
      automate_if:
        - dti <= 0.36
      recommend_if:
        - expression: dti > 0.36
          governed_by:
            type: agency_guidelines
            agency: fannie
            guideline_name: Manual UW Maximum DTI
            citation: Selling Guide B3-6-02
            threshold_field: dti.front_max
        - expression: dti <= 0.43
          governed_by:
            type: regulatory_rules
            authority: qm
            rule_name: QM Safe Harbor DTI Maximum
            citation: 12 CFR 1026.43(e)(2)
            threshold_field: dti.back_max
      block_if:
        - expression: dti > 0.50
          governed_by:
            type: agency_guidelines
            agency: fannie
            guideline_name: DU Maximum DTI
            citation: Selling Guide B3-6-02
            threshold_field: dti.back_max
      escalate_if:
        - income_verification.confidence < 0.85
    sla_seconds: 5
    trace_required: true
    contamination_guard:
      reject_if_upstream_confidence_below: 0.75

  - id: ltv_assessment
    name: LTV assessment
    atomic_tool: ltv_assessment_tool
    context_window_days: 30
    type: dependent
    depends_on:
      - decision: credit_assessment
        required_output: credit_band
        inherit_context: true
    description: >
      Calculates loan-to-value ratio against property appraisal.
      Credit band from upstream influences maximum allowable LTV.
    own_data:
      - property_appraisal
      - purchase_price
      - down_payment
    shared_data:
      - application_record
    persona: underwriting_agent
    mode: auto_execute
    risk_level: low
    owner_team: underwriting
    boundary:
      automate_if:
        - expression: ltv <= 0.80
          governed_by:
            type: agency_guidelines
            agency: fannie
            guideline_name: Primary Residence 1-Unit Max LTV
            citation: Selling Guide B2-1.2-01
            threshold_field: ltv.no_mi_threshold
      recommend_if:
        - expression: ltv > 0.80
          governed_by:
            type: agency_guidelines
            agency: fannie
            guideline_name: Primary Residence 1-Unit Max LTV
            citation: Selling Guide B2-1.2-01
            threshold_field: ltv.max
        - ltv <= 0.95
      block_if:
        - expression: ltv > 0.97
          governed_by:
            type: agency_guidelines
            agency: fannie
            guideline_name: Primary Residence 1-Unit Max LTV
            citation: Selling Guide B2-1.2-01
            threshold_field: ltv.max
      escalate_if:
        - appraisal_disputed == true
    sla_seconds: 5
    trace_required: true

  - id: product_eligibility
    name: Product eligibility
    atomic_tool: product_eligibility_tool
    context_window_days: 90
    type: dependent
    depends_on:
      - decision: dti_calculation
        required_output: dti_ratio
        inherit_context: true
      - decision: ltv_assessment
        required_output: ltv_ratio
        inherit_context: true
    description: >
      Determines which loan products the applicant qualifies for
      based on DTI, LTV, credit band, and income type.
      First decision to combine multiple upstream contexts.
    own_data: []
    shared_data:
      - product_catalog
      - regulatory_constraints
    persona: product_eligibility_agent
    mode: recommend
    risk_level: medium
    owner_team: product_ops
    boundary:
      automate_if:
        - eligible_products.count >= 1
        - no_guideline_exceptions_required == true
      recommend_if:
        - eligible_with_exceptions == true
      block_if:
        - no_eligible_products == true
      escalate_if:
        - guideline_exception_required == true
    sla_seconds: 10
    trace_required: true

  - id: rate_pricing
    name: Rate pricing
    atomic_tool: rate_pricing_tool
    context_window_days: 7
    type: dependent
    depends_on:
      - decision: credit_assessment
        required_output: credit_score
        inherit_context: true
      - decision: dti_calculation
        required_output: dti_ratio
        inherit_context: true
      - decision: ltv_assessment
        required_output: ltv_ratio
        inherit_context: true
    description: >
      Determines interest rate and pricing adjustments (LLPAs)
      based on credit score, DTI, LTV, and loan type.
      Directly impacts applicant offer and margin.
    own_data:
      - rate_sheet
      - lock_period
      - loan_type
    shared_data:
      - product_catalog
    persona: pricing_agent
    mode: auto_execute
    risk_level: medium
    owner_team: secondary_markets
    boundary:
      automate_if:
        - rate_within_normal_band == true
        - no_manual_adjustments_required == true
      recommend_if:
        - pricing_exception_possible == true
      block_if:
        - expression: rate_exceeds_usury_limit == true
          governed_by:
            type: regulatory_rules
            authority: state
            rule_name: Varies by property state
            citation: NY Banking Law §14-a (NY) · varies by state
            threshold_field: rate.usury_cap
      escalate_if:
        - concurrent_rate_lock_conflict == true
    sla_seconds: 8
    trace_required: true

  - id: underwriting_decision
    name: Underwriting decision
    atomic_tool: underwriting_decision_tool
    context_window_days: 365
    type: dependent
    depends_on:
      - decision: income_verification
        required_output: verified_income
        inherit_context: true
      - decision: credit_assessment
        required_output: credit_band
        inherit_context: true
      - decision: fraud_screening
        required_output: fraud_cleared
        inherit_context: true
      - decision: dti_calculation
        required_output: dti_ratio
        inherit_context: true
      - decision: ltv_assessment
        required_output: ltv_ratio
        inherit_context: true
      - decision: product_eligibility
        required_output: eligible_products
        inherit_context: true
      - decision: title_assessment
        required_output: title_disposition
        inherit_context: true
    description: >
      Master underwriting decision — synthesises all upstream
      context to produce approve, conditional approve, or decline.
      Highest-stakes decision in the pipeline. Human approval
      required for anything above low risk.
    own_data:
      - underwriter_notes
      - exception_log
    shared_data:
      - application_record
      - regulatory_constraints
    persona: senior_underwriting_agent
    mode: human_approval
    risk_level: high
    owner_team: underwriting
    boundary:
      automate_if:
        - all_upstream_auto_cleared == true
        - risk_score <= 0.25
        - no_exceptions_required == true
      recommend_if:
        - risk_score > 0.25
        - risk_score <= 0.60
      block_if:
        - any_upstream_hard_block == true
        - fraud_screening.decision == block
      escalate_if:
        - risk_score > 0.60
        - senior_underwriter_review_required == true
    sla_seconds: 300
    trace_required: true
    contamination_guard:
      fail_if_any_upstream_blocked: true

  - id: approval_routing
    name: Approval routing
    atomic_tool: approval_routing_tool
    context_window_days: 30
    type: dependent
    depends_on:
      - decision: underwriting_decision
        required_output: underwriting_outcome
        inherit_context: true
    description: >
      Routes the underwriting outcome to the correct downstream
      workflow — approval letter, counter-offer, or decline notice.
      Determines communication channel and timeline.
    own_data:
      - routing_rules
      - communication_templates
    shared_data:
      - customer_profile
      - application_record
    persona: workflow_routing_agent
    mode: auto_execute
    risk_level: low
    owner_team: loan_ops
    boundary:
      automate_if:
        - underwriting_decision.outcome in [approve, decline]
      recommend_if:
        - underwriting_decision.outcome == conditional_approve
      block_if: []
      escalate_if:
        - applicant_dispute_flag == true
    sla_seconds: 15
    trace_required: true

  - id: closing_readiness
    name: Closing readiness
    atomic_tool: closing_readiness_tool
    context_window_days: 180
    type: dependent
    depends_on:
      - decision: underwriting_decision
        required_output: underwriting_outcome
        inherit_context: true
      - decision: compliance_check
        required_output: compliance_cleared
        inherit_context: true
    description: >
      Validates all conditions are satisfied before scheduling
      closing — title search, insurance binder, final conditions,
      and closing disclosure timing compliance.
    own_data:
      - title_search_result
      - insurance_binder
      - final_conditions_checklist
      - closing_disclosure_sent_at
    shared_data:
      - application_record
      - regulatory_constraints
    persona: closing_agent
    mode: human_approval
    risk_level: high
    owner_team: closing_ops
    boundary:
      automate_if:
        - all_conditions_cleared == true
        - cd_timing_compliant == true
        - title_clear == true
      recommend_if:
        - minor_conditions_outstanding == true
      block_if:
        - title_defect == true
        - compliance_check.decision == block
        - expression: cd_timing_violation == true
          governed_by:
            type: regulatory_rules
            authority: federal
            rule_name: Closing Disclosure Delivery
            citation: Regulation Z §1026.19(f)
      escalate_if:
        - lien_dispute == true
        - insurance_gap == true
        - rate_lock_expiring_soon == true
    sla_seconds: 180
    trace_required: true

  - id: asset_verification
    name: Asset verification
    atomic_tool: asset_verification_tool
    context_window_days: 90
    type: independent
    description: >
      Evaluates asset documentation quality — large deposits, gift funds,
      and reserves adequacy. A large unsourced deposit is escalated for
      sourcing (not denied); a reserves shortfall is a hard block.
    own_data:
      - bank_statements
      - asset_documents
      - gift_letters
    shared_data:
      - reserves_requirement
    persona: asset_verification_agent
    mode: recommend
    risk_level: medium
    owner_team: underwriting_ops
    boundary:
      automate_if:
        - assets_clear == true
      block_if:
        - expression: reserves_insufficient == true
          governed_by:
            type: agency_guidelines
            authority: fannie_mae
            rule_name: Reserves Requirements
            citation: Fannie Mae B3-4.4-01
      escalate_if:
        - needs_sourcing == true
    sla_seconds: 30
    trace_required: true

  - id: title_assessment
    name: Title assessment
    atomic_tool: title_assessment_tool
    context_window_days: 90
    type: independent
    description: >
      Reviews the title commitment Schedule B — liens / encumbrances
      (property_encumbrances), title-search findings (title_findings),
      and vesting (ownership_chain). Runs LienResolver to classify each
      lien (priority, resolvability, required action, agency treatment)
      and rolls them up to a single title_disposition. Auto-block liens
      (IRS / state / property tax, judgment, mechanics, child support,
      lis pendens) block; resolvable liens (HOA), an easement affecting
      use, a non-borrower owner who must sign, or a title not yet cleared
      escalate; an otherwise clear title allows. Wave 0 independent leaf —
      runs in parallel with fraud_screening; underwriting_decision reads it.
    own_data:
      - property_encumbrances
      - title_findings
      - ownership_chain
    shared_data:
      - application_record
    persona: title_assessment_agent
    mode: human_approval
    risk_level: high
    owner_team: title_ops
    boundary:
      automate_if:
        - title_disposition == clear
      block_if:
        - title_disposition in [block, fatal_block]
      escalate_if:
        - title_disposition == conditions
    sla_seconds: 60
    trace_required: true

# ─────────────────────────────────────────────
# DECISION EXECUTION ORDER
# ─────────────────────────────────────────────
execution_order:
  parallel_independent:
    - lead_scoring
    - employment_reconciliation
    - credit_assessment
    - fraud_screening
    - compliance_check
    - asset_verification
    - title_assessment
  sequential_dependent:
    - [income_verification]       # needs: employment_reconciliation
    - [dti_calculation]           # needs: income_verification
    - [ltv_assessment]            # needs: credit_assessment
    - [product_eligibility]       # needs: dti + ltv
    - [rate_pricing]              # needs: credit + dti + ltv
    - [underwriting_decision]     # needs: all above
    - [approval_routing]          # needs: underwriting
    - [closing_readiness]         # needs: underwriting + compliance

# ─────────────────────────────────────────────
# HARD RULES — apply across all decisions
# ─────────────────────────────────────────────
hard_rules:
  - no_decision_without_owner
  - no_action_without_policy
  - no_context_without_lineage
  - no_agent_without_permissions
  - no_execution_without_trace
  - fraud_block_stops_pipeline
  - compliance_block_stops_closing
  - upstream_block_propagates_to_dependents

# ─────────────────────────────────────────────
# REFLECTION — agent learning from human overrides
# ─────────────────────────────────────────────
# When a human overrides an AI decision, capture the reason and
# replay it to the same agent the next time it sees a similar event.
# This is how the system improves without retraining: the override
# log becomes a per-agent memory the boundary engine consults.
reflection:
  trigger: human_override
  extract:
    - override_reason
    - override_reason_code
    - reviewer_role
    - original_ai_decision
  store_as: agent_learning
  feed_back_to: same_agent_next_similar_event
  retention_days: 365