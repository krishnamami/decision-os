<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision OS — {% block title %}Workbench{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-8">
      <a href="/workbench" class="flex items-center gap-2 font-semibold text-slate-900">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        Decision OS · Workbench
      </a>
      <div class="flex items-center gap-6 text-sm text-slate-600">
        <a href="/workbench" class="hover:text-slate-900 {% if active_nav == 'dashboard' %}text-slate-900 font-medium{% endif %}">Dashboard</a>
        <a href="/workbench/queue" class="hover:text-slate-900 {% if active_nav == 'queue' %}text-slate-900 font-medium{% endif %}">Review Queue</a>
        <a href="/workbench/analytics" class="hover:text-slate-900 {% if active_nav == 'analytics' %}text-slate-900 font-medium{% endif %}">Analytics</a>
      </div>
      <div class="ml-auto text-xs text-slate-400 mono">EDMS Postgres</div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
