<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- subtle vignette background -->
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- per-layer gradients -->
    <linearGradient id="gSrc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/><stop offset="100%" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="gIng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e3a44"/><stop offset="100%" stop-color="#072a31"/>
    </linearGradient>
    <linearGradient id="gOnt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2b5e"/><stop offset="100%" stop-color="#241a3d"/>
    </linearGradient>
    <linearGradient id="gDec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e2b3a"/><stop offset="100%" stop-color="#3d1a26"/>
    </linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e4a1b" /><stop offset="100%" stop-color="#3d300f"/>
    </linearGradient>
    <linearGradient id="gGov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15412b"/><stop offset="100%" stop-color="#0c2a1b"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b98a9"/>
    </marker>
    <marker id="arrowFb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0b341"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="62" fill="#ffffff" font-size="34" font-weight="700">Decision OS</text>
  <text x="60" y="92" fill="#8b98a9" font-size="17" font-weight="400">Governed · Explainable · Human-in-the-loop decision platform</text>
  <line x1="60" y1="108" x2="1340" y2="108" stroke="#21262d" stroke-width="1"/>

  <!-- ============ LAYER BANDS (vertical pipeline, left) ============ -->
  <!-- Each layer: rounded container with accent left border, title, and child chips -->

  <!-- helper geometry: containers stacked -->
  <!-- SOURCE -->
  <g>
    <rect x="60" y="140" width="900" height="92" rx="14" fill="url(#gSrc)" stroke="#2f4d80" stroke-width="1.5"/>
    <rect x="60" y="140" width="6" height="92" rx="3" fill="#5b8def"/>
    <text x="84" y="170" fill="#cdd9ee" font-size="13" font-weight="700" letter-spacing="1.5">SOURCE SYSTEMS</text>
    <g fill="#0b1220" stroke="#3a5a93" stroke-width="1">
      <rect x="84" y="184" width="250" height="34" rx="8"/>
      <rect x="350" y="184" width="270" height="34" rx="8"/>
      <rect x="636" y="184" width="300" height="34" rx="8"/>
    </g>
    <g fill="#dbe6f7" font-size="14" text-anchor="middle">
      <text x="209" y="206">CDC streams</text>
      <text x="485" y="206">XML / document feeds</text>
      <text x="786" y="206">External APIs</text>
    </g>
  </g>

  <!-- INGESTION -->
  <g>
    <rect x="60" y="258" width="900" height="92" rx="14" fill="url(#gIng)" stroke="#0f5d6b" stroke-width="1.5"/>
    <rect x="60" y="258" width="6" height="92" rx="3" fill="#2bd4e6"/>
    <text x="84" y="288" fill="#bfeef4" font-size="13" font-weight="700" letter-spacing="1.5">CONNECTOR &amp; INGESTION</text>
    <g fill="#06181c" stroke="#147e90" stroke-width="1">
      <rect x="84" y="302" width="410" height="34" rx="8"/>
      <rect x="510" y="302" width="426" height="34" rx="8"/>
    </g>
    <g fill="#d6f6fa" font-size="14" text-anchor="middle">
      <text x="289" y="324">Typed connectors · normalize + hydrate</text>
      <text x="723" y="324">Context datasets · snapshotted entity state</text>
    </g>
  </g>

  <!-- ONTOLOGY -->
  <g>
    <rect x="60" y="376" width="900" height="92" rx="14" fill="url(#gOnt)" stroke="#5a4490" stroke-width="1.5"/>
    <rect x="60" y="376" width="6" height="92" rx="3" fill="#a880f0"/>
    <text x="84" y="406" fill="#e0d4f7" font-size="13" font-weight="700" letter-spacing="1.5">ONTOLOGY LAYER</text>
    <g fill="#140c24" stroke="#6a52a8" stroke-width="1">
      <rect x="84" y="420" width="410" height="34" rx="8"/>
      <rect x="510" y="420" width="426" height="34" rx="8"/>
    </g>
    <g fill="#ece3fb" font-size="14" text-anchor="middle">
      <text x="289" y="442">Business objects + semantic links</text>
      <text x="723" y="442">System objects · decisions, traces</text>
    </g>
  </g>

  <!-- DECISION ENGINE -->
  <g>
    <rect x="60" y="494" width="900" height="110" rx="14" fill="url(#gDec)" stroke="#90445a" stroke-width="1.5"/>
    <rect x="60" y="494" width="6" height="110" rx="3" fill="#f0628a"/>
    <text x="84" y="524" fill="#f7d4de" font-size="13" font-weight="700" letter-spacing="1.5">DECISION ENGINE</text>
    <g fill="#240c14" stroke="#a8526a" stroke-width="1">
      <rect x="84" y="538" width="270" height="50" rx="8"/>
      <rect x="370" y="538" width="270" height="50" rx="8"/>
      <rect x="656" y="538" width="280" height="50" rx="8"/>
    </g>
    <g fill="#fbe3ea" font-size="13.5" text-anchor="middle">
      <text x="219" y="560">Boundary engine</text>
      <text x="219" y="578" fill="#d39aa9" font-size="11.5">automate / recommend / escalate / block</text>
      <text x="505" y="560">DAG executor</text>
      <text x="505" y="578" fill="#d39aa9" font-size="11.5">dependency-aware triggers</text>
      <text x="796" y="560">Decision agents</text>
      <text x="796" y="578" fill="#d39aa9" font-size="11.5">critic + reflection loop</text>
    </g>
  </g>

  <!-- PERSONA WORKBENCH -->
  <g>
    <rect x="60" y="630" width="900" height="92" rx="14" fill="url(#gApp)" stroke="#907334" stroke-width="1.5"/>
    <rect x="60" y="630" width="6" height="92" rx="3" fill="#f0c14b"/>
    <text x="84" y="660" fill="#f7ecd0" font-size="13" font-weight="700" letter-spacing="1.5">PERSONA WORKBENCH</text>
    <g fill="#1f1808" stroke="#a8893f" stroke-width="1">
      <rect x="84" y="674" width="270" height="34" rx="8"/>
      <rect x="370" y="674" width="270" height="34" rx="8"/>
      <rect x="656" y="674" width="280" height="34" rx="8"/>
    </g>
    <g fill="#fbf2dc" font-size="13.5" text-anchor="middle">
      <text x="219" y="696">Per-persona queues</text>
      <text x="505" y="696">Evidence + trace viewer</text>
      <text x="796" y="696">Human override capture</text>
    </g>
  </g>

  <!-- ============ GOVERNANCE SIDE RAIL (right) ============ -->
  <g>
    <rect x="1000" y="140" width="340" height="582" rx="14" fill="url(#gGov)" stroke="#1f6e47" stroke-width="1.5"/>
    <rect x="1000" y="140" width="6" height="582" rx="3" fill="#3ad17e"/>
    <text x="1024" y="170" fill="#cdf4dd" font-size="13" font-weight="700" letter-spacing="1.5">GOVERNANCE &amp; OBSERVABILITY</text>
    <g fill="#06180f" stroke="#2a8a59" stroke-width="1">
      <rect x="1024" y="200" width="292" height="56" rx="8"/>
      <rect x="1024" y="272" width="292" height="56" rx="8"/>
      <rect x="1024" y="344" width="292" height="56" rx="8"/>
    </g>
    <g fill="#d6f7e5" font-size="14" text-anchor="middle">
      <text x="1170" y="233">Lineage + audit trace</text>
      <text x="1170" y="305">DataOps quality monitoring</text>
      <text x="1170" y="377">Policy / hard-rule registry</text>
    </g>
    <!-- hard rules mini-list -->
    <text x="1024" y="442" fill="#8fd6ab" font-size="12" font-weight="700" letter-spacing="1">HARD RULES</text>
    <g fill="#9fb0a8" font-size="12.5">
      <text x="1024" y="466">— No decision without owner</text>
      <text x="1024" y="488">— No action without policy</text>
      <text x="1024" y="510">— No context without lineage</text>
      <text x="1024" y="532">— No agent without permissions</text>
      <text x="1024" y="554">— No execution without trace</text>
    </g>
  </g>

  <!-- ============ FLOW ARROWS (down the left pipeline) ============ -->
  <g stroke="#8b98a9" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="510" y1="232" x2="510" y2="256"/>
    <line x1="510" y1="350" x2="510" y2="374"/>
    <line x1="510" y1="468" x2="510" y2="492"/>
    <line x1="510" y1="604" x2="510" y2="628"/>
  </g>

  <!-- governance cross-links (engine + ontology <-> governance) -->
  <g stroke="#3ad17e" stroke-width="2" fill="none" stroke-dasharray="2 0" opacity="0.8">
    <path d="M960 422 H 1000" marker-end="url(#arrow)"/>
    <path d="M960 549 H 1000" marker-end="url(#arrow)"/>
  </g>

  <!-- feedback loop: override -> agents (routed cleanly to the right of the pipeline) -->
  <g stroke="#e0b341" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrowFb)" filter="url(#glow)">
    <path d="M796 710 V 768 H 978 V 563 L 940 563"/>
  </g>
  <text x="700" y="792" fill="#e0b341" font-size="12.5" font-weight="600">feedback captured as agent memory</text>

  <!-- footer caption -->
  <text x="60" y="828" fill="#5b6573" font-size="13">Data flows top-to-bottom; governance &amp; lineage cross-cut every layer; human overrides feed back as agent memory.</text>
</svg>
